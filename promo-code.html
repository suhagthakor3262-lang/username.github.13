<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Promo Codes - PROSAFEYONOGAME2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; color: #111827; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
        
        .promo-card {
            background: #ffffff;
            border: 2px solid #2563eb;
            border-radius: 18px;
            max-width: 480px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1);
        }

        .promo-icon-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px auto;
        }

        .promo-badge {
            display: inline-block;
            background: #dc2626;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .promo-heading {
            font-size: 22px;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .promo-subtext {
            font-size: 13.5px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .code-preview-box {
            background: #f8fafc;
            border: 1.5px dashed #2563eb;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            color: #2563eb;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .back-home-btn {
            display: inline-block;
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
            transition: background 0.2s;
        }

        .back-home-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="promo-card">
        <div class="promo-icon-box">🎁</div>
        <span class="promo-badge">COMING SOON</span>
        <h1 class="promo-heading">Daily Fresh Promo Codes</h1>
        <p class="promo-subtext">We are preparing today's active bonus promo codes for you. Check back shortly to claim your free reward!</p>
        
        <div class="code-preview-box">
            PROMO-CODE-2026-XXXX
        </div>

        <a href="index.html" class="back-home-btn">🏡 Return To Home</a>
    </div>

</body>
</html>
